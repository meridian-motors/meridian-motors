# Supabase CLI project configuration (local development).
project_id = "meridian-motors"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]
extra_search_path = ["public", "extensions"]
max_rows = 100

[db]
port = 54322
major_version = 17

[db.seed]
# Demo data is NEVER loaded automatically. See supabase/seed/README.md.
enabled = false

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enabled = true
enable_confirmations = true
double_confirm_changes = true

[storage]
enabled = true
file_size_limit = "15MiB"
